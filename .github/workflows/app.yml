name: app (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner (until it is committed in M6)
        run: |
          flutter create --platforms=windows --project-name storage_cleaner --org com.storagecleaner .
          # flutter create adds a counter-app test that doesn't apply here.
          if grep -q "MyApp" test/widget_test.dart 2>/dev/null; then rm test/widget_test.dart; fi

      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep "•" analyze.txt | head -60 | while IFS= read -r l; do
            case "$l" in
              *error*) lvl=error ;;
              *warning*) lvl=warning ;;
              *) lvl=notice ;;
            esac
            echo "::${lvl} title=flutter analyze::${l}"
          done
          exit $code

      - name: Test (real Windows file system)
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          echo "::notice title=App test totals::$(tail -1 test.txt)"
          if [ "$code" != 0 ]; then
            # Failure details as one annotation (raw logs may be unreadable).
            details=$(grep -v '^\s*$' test.txt | grep -A25 -E '\[E\]|Error|Expected|Exception' | head -120 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing tests::${details}"
          fi
          exit $code

      - name: Build
        run: flutter build windows --release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: StorageCleaner-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
