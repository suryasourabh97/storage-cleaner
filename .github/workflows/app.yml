name: app (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner (until it is committed in M6)
        run: |
          flutter create --platforms=windows --project-name storage_cleaner --org com.storagecleaner .
          # flutter create adds a counter-app test that doesn't apply here.
          if grep -q "MyApp" test/widget_test.dart 2>/dev/null; then rm test/widget_test.dart; fi

      - run: flutter pub get

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          code=$?
          while IFS='|' read -r sev type rule file line col len msg; do
            [ -z "$file" ] && continue
            rel="${file#$GITHUB_WORKSPACE/}"
            case "$sev" in
              ERROR) level=error ;;
              WARNING) level=warning ;;
              *) level=notice ;;
            esac
            echo "::${level} file=${rel},line=${line},title=${rule}::${msg}"
          done < analyze.txt
          if [ "$code" != 0 ]; then
            summary=$(sed 's/%/%25/g' analyze.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=dart analyze (all findings)::${summary}"
          fi
          # Infos don't fail the build; warnings and errors do.
          grep -qE '^(ERROR|WARNING)\|' analyze.txt && exit 1 || exit 0

      - name: Test (real Windows file system)
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          echo "::notice title=App test totals::$(tail -1 test.txt)"
          if [ -f calibration_report.txt ]; then
            echo "::notice title=Similar-photo calibration::$(sed 's/%/%25/g' calibration_report.txt | awk '{printf "%s%%0A", $0}')"
          fi
          if [ "$code" != 0 ]; then
            # Failure details as one annotation (raw logs may be unreadable).
            details=$(grep -v '^\s*$' test.txt | grep -A25 -E '\[E\]|Error|Expected|Exception' | head -120 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing tests::${details}"
          fi
          exit $code

      - name: Build
        run: flutter build windows --release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: StorageCleaner-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Render screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          flutter test test_screenshots --update-goldens
          mkdir -p "$RUNNER_TEMP/shots"
          cp test_screenshots/screenshots/*.png "$RUNNER_TEMP/shots/"
          echo "::notice title=Screenshots::$(ls test_screenshots/screenshots | tr '\n' ' ')"

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('app/test_screenshots/screenshots/*.png') != ''
        continue-on-error: true
        working-directory: .
        run: |
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cd pub
          git init -q
          git checkout -q -b ci-screenshots
          cp ../shots/*.png .
          echo "Screenshots rendered by CI for commit $GITHUB_SHA" > README.md
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
