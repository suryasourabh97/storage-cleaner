name: cleaner_core

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cleaner_core
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
      - name: Analyze
        # Every finding becomes an annotation (readable from the API even
        # when raw logs are not).
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          code=$?
          while IFS='|' read -r sev type rule file line col len msg; do
            [ -z "$file" ] && continue
            rel="${file#$GITHUB_WORKSPACE/}"
            case "$sev" in
              ERROR) level=error ;;
              WARNING) level=warning ;;
              *) level=notice ;;
            esac
            echo "::${level} file=${rel},line=${line},col=${col},title=${rule}::${msg}"
          done < analyze.txt
          summary=$(sed 's/%/%25/g' analyze.txt | awk '{printf "%s%%0A", $0}')
          [ "$code" != 0 ] && echo "::error title=dart analyze (all findings)::${summary}"
          exit $code
      - name: Test
        run: |
          set -o pipefail
          dart test --reporter github 2>&1 | tee test.txt
          echo "::notice title=Test totals::$(grep -E 'tests? (passed|failed)|All tests|Some tests' test.txt | tail -1)"
          echo "::notice title=Safety tests::$(dart test -t safety --reporter github 2>&1 | tail -1)"
