name: storage_cleaner
description: Storage Cleaner for Windows — safely free disk space.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cleaner_core:
    path: ../packages/cleaner_core
  ffi: ^2.1.0
  file_selector: ^1.0.3
  path: ^1.9.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  win32: ^5.5.0

dev_dependencies:
  flutter_lints: ^5.0.0
  image: ^4.2.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
